volumes:
  postgres_data:
    driver: local
  designer_obj_repo:
    driver: local
  local_files:
    driver: local
  tempo-data:
  grafana-data:

services:
  hetida-designer-frontend:
    build:
      context: .
      dockerfile: Dockerfile-frontend
    #image: hetida/designer-frontend
    ports:
      - 80:8080
    depends_on:
      hetida-designer-backend:
        condition: service_started
      hetida-designer-demo-adapter-python:
        condition: service_started

  hetida-designer-backend:
    build:
      context: .
      dockerfile: Dockerfile-runtime
    #image: hetida/designer-backend
    ports:
      - 8080:8090
    environment:
      - HD_DATABASE_URL=postgresql+psycopg://hetida_designer_dbuser:hetida_designer_dbpasswd@hetida-designer-db:5432/hetida_designer_db
      - HD_ENSURE_DB_SCHEMA=true
      - HD_IS_RUNTIME_SERVICE=false
      - HD_USE_AUTH=false
      - MAX_WORKERS=1
      #- LOG_LEVEL=DEBUG
      - LOG_HTTPX=true
      - HETIDA_DESIGNER_PURE_UVICORN=true
      #- LOG_DIRECT_PROVISIONING_OUTPUTS=true
      - HD_OTEL_VIA_LOGFIRE_ACTIVE=true
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - OTEL_SERVICE_NAME=hetida-designer-backend

    healthcheck:
      test: curl --fail http://hetida-designer-backend:8090/api/info || exit 1
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 60s
    depends_on:
      hetida-designer-db:
        condition: service_healthy
      hetida-designer-runtime:
        condition: service_started

  hetida-designer-runtime:
    build:
      context: .
      dockerfile: Dockerfile-runtime
    #image: hetida/designer-runtime
    restart: always
    ports:
      - 8090:8090
    volumes:
      - designer_obj_repo:/mnt/obj_repo
      - ./runtime/demodata/local_files:/mnt/mounted_local_files
    environment:
      RUNTIME_LOCAL_FILE_ADAPTER_LOCAL_DIRECTORIES: '["/mnt/mounted_local_files"]'
      HD_IS_BACKEND_SERVICE: "false"
      HD_USE_AUTH: "false"
      MAX_WORKERS: 1
      #LOG_LEVEL: "DEBUG"
      LOG_HTTPX: "true"
      HETIDA_DESIGNER_PURE_UVICORN: "true"
      #LOG_DIRECT_PROVISIONING_OUTPUTS: "true"
      HD_OTEL_VIA_LOGFIRE_ACTIVE: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"
      OTEL_SERVICE_NAME: "hetida-designer-runtime"

  otel-collector:
    image: otel/opentelemetry-collector:latest
    ports:
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml
    command: ["--config=/etc/otel-collector-config.yaml"]

  tempo:
    image: grafana/tempo:latest
    container_name: tempo
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    #ports:
    # - "3200:3200" # Tempo HTTP API
    # - "4317:4317" # OTLP gRPC
    # - "4318:4318" # OTLP HTTP

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
      - ./grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - tempo

  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686" # UI
      # - "4317:4317" # OTLP gRPC
      # - "4318:4318" # OTLP HTTP

  hetida-designer-db:
    image: postgres:latest
    ports:
      - 5430:5432
    volumes:
      - postgres_data:/var/lib/postgresql
    environment:
      POSTGRES_DB: hetida_designer_db
      POSTGRES_USER: hetida_designer_dbuser
      POSTGRES_PASSWORD: hetida_designer_dbpasswd

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U hetida_designer_dbuser -d hetida_designer_db",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  hetida-designer-demo-adapter-python:
    build:
      context: .
      dockerfile: Dockerfile-demo-adapter-python
    image: hetida/designer-demo-adapter-python
    ports:
      - 8092:8092

networks:
  default:
    name: hetida-designer-network
