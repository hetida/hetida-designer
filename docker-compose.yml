volumes:
  postgres_data:
    driver: local
  designer_obj_repo:
    driver: local
  local_files:
    driver: local

services:
  hetida-designer-frontend:
    image: hetida/designer-frontend:latest
    ports:
      - 80:8080
    depends_on:
      hetida-designer-backend:
        condition: service_healthy
      hetida-designer-demo-adapter-python:
        condition: service_started


  hetida-designer-backend:
    image: hetida/designer-backend:latest
    ports:
      - 8080:8090
    environment:
      - HD_DATABASE_URL=postgresql+psycopg2://hetida_designer_dbuser:hetida_designer_dbpasswd@hetida-designer-db:5432/hetida_designer_db
      - HD_ENSURE_DB_SCHEMA=true
      - HD_IS_RUNTIME_SERVICE=false
      - HD_USE_AUTH=false
      - OTEL_SERVICE_NAME=hd_backend
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://opentelemetry-service:4317
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
      - OTEL_METRIC_EXPORT_INTERVAL=5000
    healthcheck:
      test: curl --fail http://hetida-designer-backend:8090/api/info || exit 1
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 20s
    depends_on:
      hetida-designer-db:
        condition: service_healthy
      hetida-designer-runtime:
        condition: service_started
      opentelemetry-service:
        condition: service_healthy


  hetida-designer-runtime:
    image: hetida/designer-runtime:latest
    volumes:
      - designer_obj_repo:/mnt/obj_repo
      - ./runtime/demodata/local_files:/mnt/mounted_local_files
    ports:
      - 8090:8090
    environment:
      - RUNTIME_LOCAL_FILE_ADAPTER_LOCAL_DIRECTORIES='["/mnt/mounted_local_files"]'
      - HD_IS_BACKEND_SERVICE=false
      - HD_USE_AUTH=false
      - LOG_LEVEL=INFO
      - OTEL_SERVICE_NAME=hd_runtime
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://opentelemetry-service:4317
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
      - OTEL_METRIC_EXPORT_INTERVAL=5000
    depends_on:
      opentelemetry-service:
        condition: service_healthy


  hetida-designer-db:
    image: postgres:latest
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: hetida_designer_db
      POSTGRES_USER: hetida_designer_dbuser
      POSTGRES_PASSWORD: hetida_designer_dbpasswd
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hetida_designer_dbuser -d hetida_designer_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  hetida-designer-demo-adapter-python:
    image: hetida/designer-demo-adapter-python
    ports:
      - 8092:8092

  opentelemetry-service:
    image: grafana/otel-lgtm:0.11.7
    ports:
      - 4317:4317
      - 4318:4318
      - 3000:3000
    environment:
      - ENABLE_LOGS_LOKI=true
      - OTEL_METRIC_EXPORT_INTERVAL=500
      - GF_PATHS_DATA=/data/grafana
    healthcheck:
      test: cat /tmp/ready
      interval: 1m
      timeout: 10s
      retries: 10
      start_period: 1m
      start_interval: 10s


networks:
  default:
    name: hetida-designer-network
