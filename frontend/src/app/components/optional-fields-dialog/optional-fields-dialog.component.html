<div mat-dialog-title>
  <h4 class="m-0">Expose Inputs with Default value for ({{ workflowName }})</h4>
  <button (click)="onCancel()" mat-icon-button>
    <mat-icon>close</mat-icon>
  </button>
</div>
<div mat-dialog-content class="dialog-content">
  @if (optionalFieldsForm) {
    <form [formGroup]="optionalFieldsForm" class="p-1">
      @for (
        optionalField of optionalFieldsArray.controls;
        track optionalField
      ) {
        <div [formGroup]="optionalField">
          <mat-checkbox class="example-margin mb-1" formControlName="exposed">
            {{ optionalField.get('name').value }}
            @if (optionalField.get('value')?.value) {
              <span>({{ optionalField.get('value')?.value }})</span>
            }
          </mat-checkbox>
        </div>
      }
    </form>
  }
</div>

<div mat-dialog-actions>
  <button (click)="onCancel()" mat-raised-button color="primary">
    {{ data.actionCancel }}
  </button>
  <button
    (click)="onOk()"
    mat-raised-button
    color="primary"
    [disabled]="!valid"
  >
    {{ data.actionOk }}
  </button>
</div>
