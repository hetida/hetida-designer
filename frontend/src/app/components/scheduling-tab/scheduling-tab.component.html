<header class="scheduling-header">
  <h1>Scheduling</h1>
  <button mat-raised-button color="primary" (click)="addNewSchedule()">
    <mat-icon>add</mat-icon>
    Add New Schedule
  </button>
</header>

<div class="schedule-table" #scheduleTableContainer>
  <table>
    <thead>
      <tr>
        <th class="active_col">Active</th>
        <th>Name</th>
        <th>Workflow / Component</th>
        <th class="wiring_col">Wiring</th>
        <th
          class="cron_col"
          title="Set when to run automatically. Format: minute hour day month weekday
'0 9 * * 1' runs Mondays at 9am
'*/15 * * * *' runs every 15 minutes"
        >
          Cron Expression
        </th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr
        *ngFor="let schedule of schedules"
        (dragover)="onDragOver($event, schedule)"
        (drop)="onDrop($event, schedule)"
      >
        <!-- Active Toggle -->
        <td class="active_col">
          <mat-slide-toggle
            [(ngModel)]="schedule.active"
            (change)="onActiveToggleChange(schedule)"
          >
          </mat-slide-toggle>
        </td>
        <!-- Name Cell -->
        <td
          (click)="
            !isEditing(schedule.id, 'name') &&
              startEdit(schedule.id, 'name', schedule.name)
          "
          [class.editing]="isEditing(schedule.id, 'name')"
        >
          <span *ngIf="!isEditing(schedule.id, 'name')" class="cell-content">
            {{ schedule.name }}
          </span>
          <input
            *ngIf="isEditing(schedule.id, 'name')"
            type="text"
            [(ngModel)]="editValue"
            (blur)="saveEdit(schedule)"
            (keydown)="onKeyDown($event, schedule)"
            class="cell-input"
            autofocus
          />
        </td>
        <!-- Transformation Cell -->
        <td>
          <ng-container *ngIf="schedule.transformation_id; else dragPrompt">
            <span
              class="trafo-item"
              (contextmenu)="
                $event.preventDefault();
                openTransformationContextMenu(item, $event)
              "
              (click)="select(schedule)"
            >
              <mat-icon
                svgIcon="icon-workflow"
                [ngClass]="{
                  'mat-icon-svg-disabled':
                    schedule.transformation_state === 'DISABLED',
                  'mat-icon-svg-draft':
                    schedule.transformation_state === 'DRAFT',
                  'mat-icon-svg-released':
                    schedule.transformation_state === 'RELEASED'
                }"
              ></mat-icon>
              <span class="text-ellipsis"
                >{{ schedule.transformation_name }} ({{
                  schedule.transformation_version_tag
                }})</span
              >
            </span>
          </ng-container>
          <ng-template #dragPrompt>
            <span style="color: #999">Drag a workflow / component here!</span>
          </ng-template>
        </td>

        <!-- Wiring Cell -->
        <td class="wiring_col">
          <button
            mat-raised-button
            color="primary"
            [disabled]="!schedule.transformation_id"
            (click)="openWiringDialog(schedule)"
          >
            Edit Wiring
          </button>
        </td>

        <!-- Cron Expression Cell -->
        <td
          class="cron_col"
          (click)="
            !isEditing(schedule.id, 'cron_expression') &&
              startEdit(
                schedule.id,
                'cron_expression',
                schedule.cron_expression
              )
          "
          [class.editing]="isEditing(schedule.id, 'cron_expression')"
        >
          <span
            *ngIf="!isEditing(schedule.id, 'cron_expression')"
            class="cell-content"
          >
            {{ schedule.cron_expression }}
          </span>
          <input
            *ngIf="isEditing(schedule.id, 'cron_expression')"
            type="cron_expression"
            [(ngModel)]="editValue"
            (blur)="saveEdit(schedule)"
            (keydown)="onKeyDown($event, schedule)"
            class="cell-input"
            autofocus
          />
        </td>

        <td>
          <button
            mat-icon-button
            title="Execute Now"
            color="primary"
            (click)="run(schedule)"
          >
            <mat-icon>play_circle_outline</mat-icon>
          </button>
          <button
            mat-icon-button
            title="Delete"
            color="primary"
            (click)="delete(schedule).subscribe()"
          >
            <mat-icon>delete_forever</mat-icon>
          </button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
