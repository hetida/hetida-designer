<div class="d-flex content-space-between" mat-dialog-title>
  <h4 class="m-0 d-flex align-items-center">
    <span>{{ data.title }}</span>
  </h4>
  <button
    (click)="_close()"
    mat-icon-button
    data-testid="close-text-result-dialog"
  >
    <mat-icon>close</mat-icon>
  </button>
</div>

<mat-dialog-content>
  @if (loading) {
    <div class="loading-container" data-testid="text-result-dialog-spinner">
      <mat-spinner diameter="40"></mat-spinner>
      @if (data.loadingText) {
        <span>{{ data.loadingText }}</span>
      }
    </div>
  } @else {
    <p>{{ message }}</p>
  }
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button
    color="primary"
    mat-raised-button
    (click)="_close()"
    data-testid="close-btn-text-result-dialog"
  >
    Close
  </button>
</mat-dialog-actions>
