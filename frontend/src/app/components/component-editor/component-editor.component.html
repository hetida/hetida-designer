<div class="h-100 overflow-hidden position-relative">
    <div class="save-indicator" [ngClass]="{
    'saved': saveStatus === 'saved',
    'unsaved': saveStatus === 'unsaved',
    'saving': saveStatus === 'saving'
  }">
        <span *ngIf="saveStatus === 'saved'">✓ Saved</span>
        <span *ngIf="saveStatus === 'unsaved'">● Unsaved changes</span>
        <span *ngIf="saveStatus === 'saving'">⟳ Saving...</span>
    </div>

    <ngx-monaco-editor #monacoEditor [options]="editorOptions" [(ngModel)]="code" (onInit)="onEditorInit($event)"
        class="h-100">
    </ngx-monaco-editor>
</div>
