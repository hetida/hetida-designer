<div class="h-100 overflow-hidden position-relative">
  @if (showIndicator) {
    <div
      class="save-indicator"
      [ngClass]="{
        saved: saveStatus === 'saved',
        unsaved: saveStatus === 'unsaved',
        saving: saveStatus === 'saving'
      }"
      [style.right.px]="minimapWidth"
    >
      @switch (saveStatus) {
        @case ('saved') {
          <span>✓ Saved</span>
        }
        @case ('unsaved') {
          <span>● Unsaved changes</span>
        }
        @case ('saving') {
          <span>⟳ Saving...</span>
        }
        @default {}
      }
    </div>
  }
  <ngx-monaco-editor
    #monacoEditor
    [options]="editorOptions"
    [(ngModel)]="code"
    (onInit)="onEditorInit($event)"
    class="h-100"
  >
  </ngx-monaco-editor>
</div>
