<div class="navigation-container__filter">
  <form>
    <mat-button-toggle-group
      [multiple]="false"
      [hideSingleSelectionIndicator]="true"
      [formControl]="typeFilter"
    >
      <mat-button-toggle
        value="WORKFLOW"
        [ngClass]="{ active: getFilterState('WORKFLOW') }"
        data-testid="workflows-navigation-container"
      >
        <mat-icon svgIcon="icon-workflow" class="mat-icon-svg"></mat-icon>
        Workflows
      </mat-button-toggle>
      <mat-button-toggle
        value="COMPONENT"
        [ngClass]="{ active: getFilterState('COMPONENT') }"
        data-testid="components-navigation-container"
      >
        <mat-icon svgIcon="icon-component" class="mat-icon-svg"></mat-icon>
        Components
      </mat-button-toggle>
    </mat-button-toggle-group>
  </form>
</div>

<div class="navigation-container__buttons">
  @if (getFilterState('WORKFLOW')) {
    <div
      class="add-button clickable"
      (click)="newWorkflow()"
      data-testid="add workflow-navigation-container"
    >
      <button mat-icon-button>
        <mat-icon>add_circle_outline</mat-icon>
      </button>
      <span>Add workflow</span>
    </div>
  }
  @if (getFilterState('COMPONENT')) {
    <div
      class="add-button clickable"
      (click)="newComponent()"
      data-testid="add component-navigation-container"
    >
      <button mat-icon-button>
        <mat-icon>add_circle_outline</mat-icon>
      </button>
      <span>Add component</span>
    </div>
  }
  <div class="right-aligned-toggle mr-1">
    <mat-slide-toggle
      [formControl]="showDeprecatedFilter"
      data-testid="show deprecated-navigation-container"
    >
      Show deprecated
    </mat-slide-toggle>
  </div>
</div>

<mat-divider></mat-divider>

<form class="navigation-container__search">
  <mat-form-field appearance="outline">
    <input
      matInput
      placeholder="Type to search..."
      [formControl]="searchFilter"
      data-testid="search-navigation-container"
    />
  </mat-form-field>
</form>

<div class="navigation-container__scrollable">
  @for (
    item of transformationsByCategory | keyvalue: sortByCategoryAlphabetically;
    track item.key
  ) {
    <hd-navigation-category
      [transformations]="item.value"
      [category]="item.key"
      (mouseleave)="closePopover()"
    >
    </hd-navigation-category>
  }
</div>
