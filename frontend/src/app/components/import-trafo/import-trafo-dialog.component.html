<div class="d-flex content-space-between" mat-dialog-title>
  <h1 class="m-0">Import Transformation(s)</h1>
  <button
    (click)="_onCancel()"
    mat-icon-button
    data-testid="close-import-trafo-dialog"
  >
    <mat-icon>close</mat-icon>
  </button>
</div>
<mat-dialog-content>
  <mat-form-field appearance="fill" class="full-width">
    <mat-label>Paste your transformation revision(s) here</mat-label>
    <textarea
      matInput
      class="trafo-input-textarea"
      [(ngModel)]="importText"
      rows="20"
      placeholder="Component Python code or JSON object or JSON array..."
    ></textarea>
  </mat-form-field>
  <div>
    <label>
      <mat-checkbox [(ngModel)]="updateCode">Update Code</mat-checkbox>
    </label>
  </div>
  <div>
    <label>
      <mat-checkbox [(ngModel)]="expandCode">Expand Code</mat-checkbox>
    </label>
  </div>
  <div>
    <label>
      <mat-checkbox [(ngModel)]="overwriteReleased">Overwrite</mat-checkbox>
      Released (DANGER!)
    </label>
  </div>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button (click)="_closeDialog()" color="primary" mat-raised-button>
    Cancel
  </button>
  <button
    (click)="importTrafos()"
    color="primary"
    mat-raised-button
    [disabled]="!importText.trim()"
  >
    Import
  </button>
</mat-dialog-actions>
